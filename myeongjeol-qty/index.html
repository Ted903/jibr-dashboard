<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f5f6f8;color:#191c22;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:2px solid #1f2430;padding-bottom:11px;margin-bottom:12px}
h1{font-size:20px;letter-spacing:-.5px}
.sub{font-size:12px;color:#6b7280;margin-top:4px}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid #e2e5ea;border-radius:7px;padding:5px 10px;font-size:11px;color:#666;text-align:center}
.pill b{display:block;font-size:12px;color:#1f2430}
nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
nav button{border:1px solid #dfe3e8;background:#fff;color:#4b5563;padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit;transition:.12s}
nav button:hover{background:#eef1f5}
nav button.on{background:#1f2430;color:#fff;border-color:#1f2430}
.panel{display:none;animation:fi .18s ease}.panel.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid #e6e9ed;border-radius:11px;padding:15px 17px;margin-bottom:12px}
.card h2{font-size:14.5px;margin-bottom:10px;letter-spacing:-.3px}
.card h2 span{font-weight:400;color:#8b919b;font-size:11.5px;margin-left:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f1f3f6;color:#3b4252;font-weight:700;padding:8px 7px;font-size:11.5px;text-align:center;border-bottom:1px solid #dfe3e8;white-space:nowrap}
th.l{text-align:left;padding-left:11px}
td{padding:8px 7px;border-bottom:1px solid #f0f2f4}
td.nm{padding-left:11px;font-weight:600}
td.nm .s{font-weight:400;color:#9aa0a9;font-size:11.5px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:#0a7d3d;font-weight:700}.dn{color:#c0392b;font-weight:700}.fl{color:#8b919b}.nw{color:#1a6fd4;font-weight:700}
tr.grp td{background:#eef1f6;font-weight:700;font-size:11.5px;color:#5a6478;letter-spacing:.3px;padding:6px 11px}
tr.st td{background:#fafbfc;font-weight:700;color:#1f2430;border-bottom:1px solid #e2e5ea}
tr.tot td{background:#1f2430;color:#fff;font-weight:800;font-size:13.5px;padding:10px 7px}
tr.tot td:first-child{padding-left:11px}
tbody tr:hover td{background:#f8fafc}
tr.tot:hover td,tr.grp:hover td,tr.st:hover td{background:inherit}
.tag{display:inline-block;margin-left:5px;font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700;vertical-align:middle}
.tag.h{background:#ffeaea;color:#c0392b}.tag.n{background:#e7f1ff;color:#1a6fd4}.tag.w{background:#fff2e0;color:#b06a00}.tag.g{background:#e6f6ec;color:#0a7d3d}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid #e6e9ed;border-radius:11px;padding:13px 15px}
.kpi .t{font-size:11px;color:#8b919b;font-weight:600}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-1px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11px;margin-top:2px;color:#6b7280}
.bars{display:flex;align-items:flex-end;gap:2px;height:30px}
.b{flex:1;border-radius:2px 2px 0 0;min-height:2px}
.chart{display:flex;align-items:flex-end;gap:18px;height:210px;padding:26px 6px 0;border-bottom:1px solid #e2e5ea;overflow-x:auto}
.cg{flex:0 0 auto;min-width:70px;display:flex;flex-direction:column;align-items:center;height:100%}
.cbs{display:flex;align-items:flex-end;gap:4px;flex:1;width:100%;justify-content:center}
.cb{width:18px;border-radius:3px 3px 0 0;position:relative;min-height:2px}
.cb span{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9.5px;color:#5a6478;font-variant-numeric:tabular-nums;white-space:nowrap}
.cl{font-size:10px;color:#5a6478;margin-top:6px;text-align:center;line-height:1.25;height:26px;word-break:keep-all}
.lg{display:flex;gap:12px;margin-top:10px;font-size:11px;color:#5a6478;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.note{font-size:12.5px;color:#3f4653;line-height:1.8}
.note b{color:#191c22}
.note li{margin-left:15px;margin-bottom:6px}
.scroll{overflow-x:auto}
.find{border-left:3px solid #1f2430;padding:9px 13px;background:#fafbfc;margin-bottom:9px;border-radius:0 7px 7px 0}
.find .h{font-weight:800;font-size:13px;margin-bottom:3px}
.find .b2{font-size:12.5px;color:#3f4653;line-height:1.75}
.find.r{border-left-color:#c0392b}.find.g2{border-left-color:#0a7d3d}.find.o{border-left-color:#b06a00}
.q{background:#f7f8fa;border:1px solid #e6e9ed;border-left:3px solid #9aa0a9;padding:8px 12px;border-radius:0 6px 6px 0;font-size:12px;color:#4b5563;margin:7px 0;line-height:1.7;white-space:pre-line}
.q .src{display:block;font-size:10.5px;color:#9aa0a9;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
footer{margin-top:16px;font-size:11px;color:#9aa0a9;text-align:center}
@media(max-width:640px){h1{font-size:17px}.wrap{padding:12px 10px 28px}table{font-size:12px}.kpi .v{font-size:20px}}
</style></head>

function compTable(title, obj, badge){
  var h='<table><thead><tr><th class="l">'+title+'</th><th>용량</th>'+obj.cols.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr></thead><tbody>';
  h+=obj.meta.map(function(m){
    return '<tr class="st"><td colspan="2" style="padding-left:11px">'+m[0]+'</td>'+m.slice(1).map(function(v){return '<td class="num">'+v+'</td>'}).join('')+'</tr>'}).join('');
  h+=obj.rows.map(function(r){
    return '<tr><td class="nm">'+r[0]+'</td><td class="num" style="color:#9aa0a9">'+r[1]+'</td>'
     +r.slice(2).map(function(v){return '<td class="num" style="'+(v==='-'?'color:#d0d4da':'font-weight:700')+'">'+v+'</td>'}).join('')+'</tr>'}).join('');
  var cnt=obj.cols.map(function(_,i){return obj.rows.filter(function(r){return r[i+2]!=='-'&&r[i+2]}).length});
  var qty=obj.cols.map(function(_,i){return obj.rows.reduce(function(s,r){var v=r[i+2];return s+(typeof v==='number'?v:0)},0)});
  h+='<tr class="tot"><td colspan="2">구성 품목 수 / 총 개수</td>'+cnt.map(function(c,i){return '<td class="num">'+c+'종 / '+qty[i]+'개</td>'}).join('')+'</tr>';
  return '<div class="card"><h2>'+title+' 세부구성 '+(badge?'<span>'+badge+'</span>':'')+'</h2><div class="scroll">'+h+'</tbody></table></div></div>';
}
