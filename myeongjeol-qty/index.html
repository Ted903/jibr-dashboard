<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>집반찬연구소 명절 제품 판매량</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f6f7f9;color:#1a1a1a;-webkit-font-smoothing:antialiased;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #1f2430;padding-bottom:12px;margin-bottom:14px}
h1{font-size:21px;letter-spacing:-.5px}
.sub{font-size:12.5px;color:#6b7280;margin-top:5px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid #e2e5ea;border-radius:7px;padding:6px 11px;font-size:11.5px;color:#555;text-align:center}
.pill b{display:block;font-size:12.5px;color:#1f2430}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
nav button{border:1px solid #dfe3e8;background:#fff;color:#4b5563;padding:8px 15px;border-radius:8px;font-size:13.5px;cursor:pointer;font-weight:600;font-family:inherit;transition:.12s}
nav button:hover{background:#eef1f5}
nav button.on{background:#1f2430;color:#fff;border-color:#1f2430}
.panel{display:none;animation:fi .18s ease}
.panel.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid #e6e9ed;border-radius:11px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:12px;letter-spacing:-.3px}
.card h2 span{font-weight:400;color:#8b919b;font-size:12px;margin-left:7px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#f1f3f6;color:#3b4252;font-weight:700;padding:9px 8px;font-size:12px;text-align:center;border-bottom:1px solid #dfe3e8;white-space:nowrap}
th.l{text-align:left;padding-left:12px}
td{padding:9px 8px;border-bottom:1px solid #f0f2f4}
td.nm{padding-left:12px;font-weight:600}
td.nm .s{font-weight:400;color:#9aa0a9;font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:#0a7d3d;font-weight:700}.dn{color:#c0392b;font-weight:700}.fl{color:#8b919b}.nw{color:#1a6fd4;font-weight:700}
tr.grp td{background:#eef1f6;font-weight:700;font-size:11.5px;color:#5a6478;letter-spacing:.4px;padding:6px 12px}
tr.st td{background:#fafbfc;font-weight:700;color:#1f2430;border-bottom:1px solid #e2e5ea}
tr.tot td{background:#1f2430;color:#fff;font-weight:800;font-size:14.5px;padding:11px 8px}
tr.tot td:first-child{padding-left:12px}
tbody tr:hover td{background:#f8fafc}
tr.tot:hover td,tr.grp:hover td,tr.st:hover td{background:inherit}
.tag{display:inline-block;margin-left:6px;background:#fff2e0;color:#b06a00;font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700;vertical-align:middle}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid #e6e9ed;border-radius:11px;padding:14px 16px}
.kpi .t{font-size:11.5px;color:#8b919b;font-weight:600}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-1px;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;margin-top:3px;color:#6b7280}
.bars{display:flex;align-items:flex-end;gap:3px;height:34px}
.b{flex:1;background:#c3cbdb;border-radius:2px 2px 0 0;min-height:2px}
.b.b2{background:#7b8bb0}.b.b3{background:#1f2430}
.chart{display:flex;align-items:flex-end;gap:24px;height:230px;padding:26px 6px 0;border-bottom:1px solid #e2e5ea;overflow-x:auto}
.cg{flex:0 0 auto;min-width:74px;display:flex;flex-direction:column;align-items:center;height:100%}
.cbs{display:flex;align-items:flex-end;gap:4px;flex:1;width:100%;justify-content:center}
.cb{width:19px;border-radius:3px 3px 0 0;position:relative;min-height:2px}
.cb span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:#5a6478;font-variant-numeric:tabular-nums;white-space:nowrap}
.cl{font-size:10.5px;color:#5a6478;margin-top:7px;text-align:center;line-height:1.3;height:28px;word-break:keep-all}
.lg{display:flex;gap:14px;margin-top:12px;font-size:11.5px;color:#5a6478;flex-wrap:wrap}
.lg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:12.5px;color:#4b5563;line-height:1.85}
.note b{color:#1f2430}
.note li{margin-left:16px;margin-bottom:5px}
.scroll{overflow-x:auto}
footer{margin-top:18px;font-size:11.5px;color:#9aa0a9;text-align:center}
@media(max-width:640px){h1{font-size:18px}.wrap{padding:14px 11px 30px}table{font-size:12.5px}.kpi .v{font-size:21px}}
</style></head>

   +'<tr><td class="nm">모둠전류 (5종)</td>'+P.map(function(p){return '<td class="num">'+nf(s2[p])+'</td>'}).join('')+'<td class="num">'+pctHtml(pct(s2[P[2]],s2[P[1]]))+'</td></tr>'
   +'<tr class="tot"><td>명절 11개 품목 합계</td>'+P.map(function(p){return '<td class="num">'+nf(g[p])+'</td>'}).join('')+'<td class="num">'+((ch>0?'+':'')+ch.toFixed(0))+'%</td></tr>'
   +'<tr><td class="nm" style="color:#8b919b">전사 전체 판매량</td>'+P.map(function(p){return '<td class="num" style="color:#8b919b">'+nf(D.totals[p])+'</td>'}).join('')+'<td class="num fl">+26%</td></tr>'
   +'<tr><td class="nm" style="color:#8b919b">명절 품목 비중</td>'+P.map(function(p){return '<td class="num" style="color:#8b919b">'+(g[p]/D.totals[p]*100).toFixed(1)+'%</td>'}).join('')+'<td></td></tr>'
   +'</tbody></table></div></div>';
  var top='<div class="card"><h2>2026 설날 판매량 TOP 5</h2><div class="scroll"><table><thead><tr><th class="l">순위 / 품목</th><th>수량</th><th>매출(만원)</th><th>26설 vs 25추석</th></tr></thead><tbody>'
   + D.items.slice().sort(function(a,b){return b.q[P[2]]-a.q[P[2]]}).slice(0,5).map(function(r,i){
       return '<tr><td class="nm">'+(i+1)+'. '+splitName(r.name)+'</td><td class="num">'+nf(r.q[P[2]])+'</td><td class="num" style="color:#6b7280">'+man(r.a[P[2]])+'</td><td class="num">'+pctHtml(pct(r.q[P[2]],r.q[P[1]]))+'</td></tr>'}).join('')
   +'</tbody></table></div></div>';
  return kpi+tb+top;
}

/* ---- 탭 2: 품목별 상세 ---- */
function tabItems(){
  var g=D.grand;
  return '<div class="card"><h2>품목별 판매량 <span>규격 변형 합산 · 단위 EA</span></h2><div class="scroll"><table>'
   +'<thead><tr><th class="l">품목명</th>'+D.periods.map(function(p){return '<th>'+p.label+'</th>'}).join('')+'<th>추이</th><th>26설 vs 25추석</th><th>26설 매출<br>(만원)</th></tr></thead><tbody>'
   +'<tr class="grp"><td colspan="7">단품류</td></tr>'+itemRows(D.cat['단품'])+subRow('단품',D.cat['단품'])
   +'<tr class="grp"><td colspan="7">모둠전류</td></tr>'+itemRows(D.cat['모둠전'])+subRow('모둠전',D.cat['모둠전'])
   +'<tr class="tot"><td>전체 합계</td>'+P.map(function(p){return '<td class="num">'+nf(g[p])+'</td>'}).join('')+'<td></td><td class="num">'+((pct(g[P[2]],g[P[1]])>0?'+':'')+pct(g[P[2]],g[P[1]]).toFixed(0))+'%</td><td class="num">'+man(D.grandA[P[2]])+'</td></tr>'
   +'</tbody></table></div>'
   +'<div class="lg"><span><i style="background:#c3cbdb"></i>2025 설날</span><span><i style="background:#7b8bb0"></i>2025 추석</span><span><i style="background:#1f2430"></i>2026 설날</span></div></div>';
}

/* ---- 탭 3: 규격(SKU)별 ---- */
function tabSku(){
  var rows=D.items.map(function(r){
    return '<tr class="grp"><td colspan="6">'+r.name+'</td></tr>'
     + r.skus.map(function(s){
        return '<tr><td class="nm" style="padding-left:24px;font-weight:500">'+s.nm+' <span class="s">'+s.spec+'</span><br><span class="s" style="font-size:11px">'+s.code+'</span></td>'
         + P.map(function(p){return '<td class="num">'+(s.q[p]?nf(s.q[p]):'-')+'</td>'}).join('')
         + '<td class="num" style="color:#6b7280">'+man(s.a[P[2]])+'</td>'
         + '<td class="num">'+pctHtml(pct(s.q[P[2]],s.q[P[1]]))+'</td></tr>'}).join('')
     + '<tr class="st"><td style="padding-left:24px">소계</td>'+P.map(function(p){return '<td class="num">'+nf(r.q[p])+'</td>'}).join('')+'<td class="num">'+man(r.a[P[2]])+'</td><td class="num">'+pctHtml(pct(r.q[P[2]],r.q[P[1]]))+'</td></tr>'; }).join('');
  return '<div class="card"><h2>규격(SKU)별 상세 <span>이카운트 품목코드 기준</span></h2><div class="scroll"><table>'
   +'<thead><tr><th class="l">품목코드 / 규격</th>'+D.periods.map(function(p){return '<th>'+p.label+'</th>'}).join('')+'<th>26설 매출<br>(만원)</th><th>26설 vs 25추석</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

/* ---- 탭 4: 추이 차트 ---- */
function tabChart(){
  var mx=MAX;
  var bars=D.items.map(function(r){
    return '<div class="cg"><div class="cbs">'+P.map(function(p,i){
      var h=r.q[p]>0?Math.max(r.q[p]/mx*88,1.5):0;
      var c=['#c3cbdb','#7b8bb0','#1f2430'][i];
      return '<div class="cb" style="height:'+h+'%;background:'+c+'">'+(i===2&&r.q[p]>0?'<span>'+nf(r.q[p])+'</span>':'')+'</div>'}).join('')
    +'</div><div class="cl">'+r.name.split('_')[0]+(r.name.indexOf('_')>0?'<br>'+r.name.split('_')[1].slice(0,10):'')+'</div></div>'}).join('');
  var tot=P.map(function(p,i){
    var h=D.grand[p]/Math.max(D.grand[P[0]],D.grand[P[1]],D.grand[P[2]])*86;
    return '<div class="cg" style="min-width:110px"><div class="cbs"><div class="cb" style="width:52px;height:'+h+'%;background:'+['#c3cbdb','#7b8bb0','#1f2430'][i]+'"><span>'+nf(D.grand[p])+'</span></div></div><div class="cl">'+D.periods[i].label+'</div></div>'}).join('');
  return '<div class="card"><h2>명절별 전체 합계 추이</h2><div class="chart" style="height:180px">'+tot+'</div></div>'
   +'<div class="card"><h2>품목별 추이 <span>3개 명절 비교</span></h2><div class="chart">'+bars+'</div>'
   +'<div class="lg"><span><i style="background:#c3cbdb"></i>2025 설날</span><span><i style="background:#7b8bb0"></i>2025 추석</span><span><i style="background:#1f2430"></i>2026 설날</span></div></div>';
}

/* ---- 탭 5: 기준/주의 ---- */
function tabNote(){
  return '<div class="card"><h2>집계 기준</h2><div class="scroll"><table><thead><tr><th class="l">명절</th><th>명절 당일</th><th>집계 기간 (당일 포함 직전 3주)</th><th>전사 총 판매량</th></tr></thead><tbody>'
   + D.periods.map(function(p){return '<tr><td class="nm">'+p.label+'</td><td class="num" style="text-align:center">'+p.date+'</td><td class="num" style="text-align:center">'+p.range+'</td><td class="num">'+nf(D.totals[p.key])+'</td></tr>'}).join('')
   +'</tbody></table></div></div>'
   +'<div class="card"><h2>해석 시 주의사항</h2><div class="note"><ul>'
   +'<li><b>2025 설날 수치 주의</b> — 동태전 · 녹두전 · 깻잎전(250G) · 모둠전3종(육전,녹두전,새우전) · 한끼모둠전은 2025년 설 시점 미출시 SKU입니다. 증감 판단은 <b>2025 추석 → 2026 설날</b> 기준으로 보는 것이 정확합니다.</li>'
   +'<li><b>규격 변형 합산</b> — 대용량 · 1인용 등 동일 품목의 규격 변형은 하나로 합산했습니다. 개별 SKU 수치는 「규격별 상세」 탭에서 확인할 수 있습니다.</li>'
   +'<li><b>모둠전 3종 4종 + 한끼모둠전</b>을 모두 포함해 취합했습니다. 단품 전류(동태전 · 깻잎전 · 녹두전)가 성장하는 동안 대표 조합인 모둠전3종(동태전,동그랑땡,깻잎전)은 역성장했습니다 — 수요 분산 가능성.</li>'
   +'<li><b>소고기무국 계열</b> — 본 취합은 소고기무국_냉동(650G) + 1인용(300G)만 포함합니다. 경상도식소고기무국(108) · 아이들한우소고기무국 원더스푼(538)을 더하면 2026 설날 기준 1,382개가 됩니다.</li>'
   +'<li><b>검증</b> — 3개 구간 모두 이카운트 조회제한 경고 없음, 총합계 행 존재, 데이터행 수량 합계 = 총합계 일치 확인.</li>'
   +'</ul></div></div>';
}

var TABS=[['요약',tabSummary],['품목별 상세',tabItems],['규격별 상세',tabSku],['추이 차트',tabChart],['집계 기준·주의',tabNote]];
document.getElementById('nav').innerHTML = TABS.map(function(t,i){return '<button data-i="'+i+'"'+(i===0?' class="on"':'')+'>'+t[0]+'</button>'}).join('');
document.getElementById('panels').innerHTML = TABS.map(function(t,i){return '<div class="panel'+(i===0?' on':'')+'" data-i="'+i+'">'+t[1]()+'</div>'}).join('');
document.getElementById('nav').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return; var i=b.dataset.i;
  [].forEach.call(document.querySelectorAll('#nav button'),function(x){x.classList.toggle('on',x.dataset.i===i)});
  [].forEach.call(document.querySelectorAll('.panel'),function(x){x.classList.toggle('on',x.dataset.i===i)});
  window.scrollTo(0,0);
});
</script></body></html>
